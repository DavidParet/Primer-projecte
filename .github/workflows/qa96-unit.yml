name: NexLupa QA96 - unit tests (no deployment)

on:
  pull_request:
    branches: [main, fix/claude-50-casos-20261112]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexlupa-qa96-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check lib/date-evidence.js
          node --check lib/nexlupa-result.js
          node --check api/analyze.js
      - name: All regression tests
        run: npm test
