name: WhatsApp pilot tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/whatsapp/**'
      - 'tests/whatsapp-*.test.js'
      - '.github/workflows/whatsapp-pilot-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run WhatsApp parsing and living-card tests
        run: node --test tests/whatsapp-pilot.test.js tests/whatsapp-activity.test.js
