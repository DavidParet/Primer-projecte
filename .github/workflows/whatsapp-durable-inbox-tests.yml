name: WhatsApp durable inbox tests
on:
  pull_request:
    paths:
      - 'lib/whatsapp/durable-inbox.js'
      - 'lib/whatsapp/verified-ingestion.js'
      - 'lib/whatsapp/meta-durable-post-bridge.js'
      - 'lib/whatsapp/family-pairing-protocol.js'
      - 'lib/whatsapp/family-pairing-issuer.js'
      - 'lib/whatsapp/meta-pairing-confirmation.js'
      - 'lib/whatsapp/restricted-family-pairing.js'
      - 'lib/whatsapp/signed-pairing-operations.js'
      - 'lib/whatsapp/signed-family-pairing.js'
      - 'lib/whatsapp/pilot-preflight.js'
      - 'lib/whatsapp/revoke-consent.js'
      - 'lib/whatsapp/tenant-security.js'
      - 'lib/whatsapp/retention-worker.js'
      - 'lib/whatsapp/retention-lock.js'
      - 'lib/whatsapp/retention-scheduler.js'
      - 'lib/whatsapp/family-authorization.js'
      - 'lib/whatsapp/membership-store.js'
      - 'lib/whatsapp/transactional-family-authorization.js'
      - 'lib/whatsapp/request-identity-binding.js'
      - 'lib/whatsapp/request-bound-consent-revoker.js'
      - 'lib/whatsapp/verified-server-session.js'
      - 'lib/whatsapp/signed-revocation-permit.js'
      - 'lib/whatsapp/signed-consent-revoker.js'
      - 'lib/whatsapp/rotating-revocation-permit.js'
      - 'lib/whatsapp/rotating-signed-consent-revoker.js'
      - 'lib/whatsapp/nonce-retention.js'
      - 'lib/whatsapp/delivery-normalizer.js'
      - 'db/migrations/20261108_whatsapp_durable_inbox.sql'
      - 'db/checks/whatsapp-pilot-release-gate-readonly.sql'
      - 'tests/whatsapp-durable-inbox.test.js'
      - 'tests/whatsapp-verified-ingestion.test.js'
      - 'tests/whatsapp-meta-durable-post-bridge.test.js'
      - 'tests/whatsapp-family-pairing.test.js'
      - 'tests/whatsapp-restricted-family-pairing.test.js'
      - 'tests/whatsapp-signed-family-pairing.test.js'
      - 'tests/whatsapp-pilot-preflight.test.js'
      - 'tests/whatsapp-consent-revocation.test.js'
      - 'tests/whatsapp-tenant-security.test.js'
      - 'tests/whatsapp-retention-worker.test.js'
      - 'tests/whatsapp-retention-lock.test.js'
      - 'tests/whatsapp-retention-scheduler.test.js'
      - 'tests/whatsapp-family-authorization.test.js'
      - 'tests/whatsapp-membership-store.test.js'
      - 'tests/whatsapp-transactional-family-authorization.test.js'
      - 'tests/whatsapp-request-identity-binding.test.js'
      - 'tests/whatsapp-verified-server-session.test.js'
      - 'tests/whatsapp-two-family-authenticated-flow.test.js'
      - 'tests/whatsapp-signed-consent-revoker.test.js'
      - 'tests/whatsapp-rotating-keyring.test.js'
      - 'tests/whatsapp-nonce-retention.test.js'
      - 'tests/whatsapp-credential-scan.test.js'
      - 'scripts/security/check-tracked-credentials.js'
      - 'scripts/whatsapp-pilot-preflight.js'
      - '.gitignore'
      - '.claude/settings.local.json'
      - '.github/workflows/whatsapp-retention-schedule.yml'
      - 'tests/sql/whatsapp-family-rls-smoke.sql'
      - 'tests/sql/whatsapp-durable-schema-smoke.sql'
      - 'tests/sql/whatsapp-consent-expiry-smoke.sql'
      - 'tests/sql/whatsapp-retention-batches-smoke.sql'
      - 'tests/sql/whatsapp-retention-restricted-role-smoke.sql'
      - 'tests/sql/whatsapp-retention-concurrency.sh'
      - 'tests/sql/whatsapp-real-tables-rls-isolation.sql'
      - 'tests/sql/whatsapp-family-membership-contract.sql'
      - 'tests/sql/whatsapp-membership-revocation-race.sh'
      - 'tests/sql/whatsapp-consent-service-role-smoke.sql'
      - 'tests/sql/whatsapp-locked-membership-function-smoke.sql'
      - 'tests/sql/whatsapp-two-family-authorized-revocation.sql'
      - 'tests/sql/whatsapp-signed-revocation-service-smoke.sql'
      - 'tests/sql/whatsapp-rotating-keyring-smoke.sql'
      - 'tests/sql/whatsapp-nonce-retention-smoke.sql'
      - 'tests/sql/whatsapp-family-pairing-smoke.sql'
      - 'tests/sql/whatsapp-restricted-pairing-service-smoke.sql'
      - 'tests/sql/whatsapp-signed-pairing-service-smoke.sql'
      - '.github/workflows/whatsapp-durable-inbox-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  durable-inbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Block tracked Vercel credentials without exposing secret values
        run: node scripts/security/check-tracked-credentials.js
      - name: Verify WhatsApp pilot remains disabled and audit missing config without secrets
        run: node scripts/whatsapp-pilot-preflight.js
      - run: node --test tests/whatsapp-durable-inbox.test.js tests/whatsapp-verified-ingestion.test.js tests/whatsapp-meta-durable-post-bridge.test.js tests/whatsapp-family-pairing.test.js tests/whatsapp-restricted-family-pairing.test.js tests/whatsapp-signed-family-pairing.test.js tests/whatsapp-pilot-preflight.test.js tests/whatsapp-consent-revocation.test.js tests/whatsapp-tenant-security.test.js tests/whatsapp-retention-worker.test.js tests/whatsapp-retention-lock.test.js tests/whatsapp-retention-scheduler.test.js tests/whatsapp-family-authorization.test.js tests/whatsapp-membership-store.test.js tests/whatsapp-transactional-family-authorization.test.js tests/whatsapp-request-identity-binding.test.js tests/whatsapp-verified-server-session.test.js tests/whatsapp-two-family-authenticated-flow.test.js tests/whatsapp-signed-consent-revoker.test.js tests/whatsapp-rotating-keyring.test.js tests/whatsapp-nonce-retention.test.js tests/whatsapp-credential-scan.test.js tests/whatsapp-webhook.test.js tests/whatsapp-delivery-normalizer.test.js

  two-family-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
          POSTGRES_DB: whatsapp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d whatsapp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-real-secret
      PGDATABASE: whatsapp_ci
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic two-family RLS test (never Neon)
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-family-rls-smoke.sql
      - name: Apply prototype WhatsApp migration only in disposable CI Postgres
        run: |
          psql -v ON_ERROR_STOP=1 -f db/migrations/20261108_whatsapp_durable_inbox.sql
      - name: Verify deduplication, revocation and rollback with real PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-durable-schema-smoke.sql
      - name: Reject expired and future consent; physically purge expired messages
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-consent-expiry-smoke.sql
      - name: Verify bounded concurrent-safe retention query on disposable PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-retention-batches-smoke.sql
      - name: Validate real RLS and limited SELECT-DELETE maintenance role
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-retention-restricted-role-smoke.sql
      - name: Test advisory lock contention with two PostgreSQL connections
        run: |
          bash tests/sql/whatsapp-retention-concurrency.sh
      - name: Verify cross-family isolation on real WhatsApp schema
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-real-tables-rls-isolation.sql
      - name: Validate synthetic family membership lifecycle and role permissions
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-family-membership-contract.sql
      - name: Verify membership revoke waits behind active transaction authorization
        run: |
          bash tests/sql/whatsapp-membership-revocation-race.sh

      - name: Test purpose-scoped consent revocation role with RLS
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-consent-service-role-smoke.sql
      - name: Deny direct membership writes and verify restricted lock function
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-locked-membership-function-smoke.sql
      - name: Verify two independently managed families and SQL consent isolation
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-two-family-authorized-revocation.sql
      - name: Deny direct SQL and verify one-use signed revocation on PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-signed-revocation-service-smoke.sql
      - name: Rotate signing keys and revoke compromised key in disposable PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-rotating-keyring-smoke.sql
      - name: Safely purge expired signed-permit nonces under restricted RLS
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-nonce-retention-smoke.sql
      - name: Verify family pairing one-use explicit WhatsApp consent on disposable PG
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-family-pairing-smoke.sql
      - name: Verify restricted pairing issuer and confirmer DB functions
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-restricted-pairing-service-smoke.sql
      - name: Reject unsigned pairing and forged Meta confirmation using restricted roles
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-signed-pairing-service-smoke.sql
      - name: Report production schema release prerequisites (read-only SQL)
        run: |
          psql -v ON_ERROR_STOP=1 -f db/checks/whatsapp-pilot-release-gate-readonly.sql
