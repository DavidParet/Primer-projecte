name: Gmail forwarding → Resend · isolated safety suite

on:
  push:
    branches:
      - 'feature/gmail-resend-forwarding-pilot-*'
    paths:
      - 'lib/forwarding/**'
      - 'api/forwarding/**'
      - 'package.json'
      - 'tests/forwarding-*.test.cjs'
      - 'tests/forwarding-*.integration.cjs'
      - '.github/workflows/forwarding-intake-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/forwarding/**'
      - 'api/forwarding/**'
      - 'package.json'
      - 'tests/forwarding-*.test.cjs'
      - 'tests/forwarding-*.integration.cjs'
      - '.github/workflows/forwarding-intake-tests.yml'

permissions:
  contents: read

jobs:
  offline-forwarding:
    name: Forwarding metadata-only, offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify PostgreSQL driver and API route load cleanly
        run: |
          node -e "if (typeof require('pg').Pool !== 'function') process.exit(1)"
          node -e "if (typeof require('./api/forwarding/pilot-webhook.js') !== 'function') process.exit(1)"
      - name: Syntax validation
        run: |
          for f in lib/forwarding/*.cjs; do node --check "$f"; done
          for f in tests/forwarding-*.test.cjs api/forwarding/*.js; do node --check "$f"; done
      - name: Offline tests (no secrets, Google, Resend or Neon access)
        run: node --test tests/forwarding-*.test.cjs

  disposable-postgres:
    name: PostgreSQL 16 — parallel encrypted receipts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    env:
      FORWARDING_CI_PG_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run concurrent, disposable PostgreSQL test
        run: node --test tests/forwarding-postgres.integration.cjs
