name: Forwarding isolated gateway — fail closed

on:
  push:
    branches:
      - 'feature/gmail-resend-forwarding-pilot-*'
    paths:
      - 'gateway/**'
      - '.github/workflows/forwarding-gateway-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/forwarding-gateway-tests.yml'

permissions:
  contents: read

jobs:
  isolated-gateway:
    name: Standalone public gateway — no credentials
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install package without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check route and source syntax
        run: npm run check
      - name: Assert serverless endpoint can load without credentials
        run: |
          node -e "const route=require('./api/webhook.js'); if(typeof route!=='function'||route.config.api.bodyParser!==false) process.exit(1)"
      - name: Run self-contained, synthetic security tests
        run: npm test

  disposable-postgres:
    name: Gateway + PostgreSQL 16 — signed concurrent deliveries
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: gateway
    env:
      GATEWAY_CI_PG_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install package without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate isolated PostgreSQL integration test source
        run: node --check tests/postgres.integration.cjs
      - name: Test signed HTTP, revoked consent, 12 parallel deliveries
        run: node --test tests/postgres.integration.cjs
