# The Vercel Git integration already creates deployments.
# This workflow runs validation only; it NEVER deploys or touches production.
name: NexLupa - validacions sense desplegament

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexlupa-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Syntax and regression smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: |
          find . -path './node_modules' -prune -o -path './.git' -prune -o -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
      - name: Existing priorities regression test
        run: node tests/run-test.js
      - name: Verify Claude audit verdict parser (offline)
        run: node tests/audit-qa50-claude.js --self-test
      - name: Safe QA credentials readiness (only yes/no)
        shell: bash
        env:
          HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HAS_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HAS_QA50_FIXTURES_GZIP_B64: ${{ secrets.QA50_FIXTURES_GZIP_B64 }}
          HAS_NEXLUPA_QA_KEY: ${{ secrets.NEXLUPA_QA_KEY }}
          HAS_NEXLUPA_QA_URL: ${{ secrets.NEXLUPA_QA_URL }}
          HAS_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          {
            echo '### NexLupa QA50 readiness (only secret presence; no values)'
            for key in ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN QA50_FIXTURES_GZIP_B64 NEXLUPA_QA_KEY NEXLUPA_QA_URL BYPASS; do
              name="HAS_$key"
              if [ -n "${!name:-}" ]; then
                echo "- $key: configured"
              else
                echo "- $key: missing"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
