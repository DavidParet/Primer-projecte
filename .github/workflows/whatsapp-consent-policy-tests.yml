name: WhatsApp consent policy tests

on:
  push:
    branches:
      - 'feat/whatsapp-consent-policy-v1'
      - 'feat/whatsapp-consent-integration-review-20261110'
    paths:
      - 'lib/whatsapp/**'
      - 'tests/whatsapp-*.test.js'
      - 'scripts/build-static.js'
      - 'lib/whatsapp/pilot-preflight.js'
      - 'scripts/whatsapp-pilot-preflight.js'
      - 'tests/whatsapp-*.test.cjs'
      - '.github/workflows/whatsapp-consent-policy-tests.yml'
  pull_request:
    paths:
      - 'lib/whatsapp/consent-policy.js'
      - 'lib/whatsapp/durable-inbox.js'
      - 'tests/whatsapp-consent-policy.test.js'
      - 'tests/whatsapp-tenant-revocation.test.js'
      - 'tests/whatsapp-durable-inbox.test.js'
      - 'tests/whatsapp-postgres-concurrency.test.cjs'
      - 'tests/whatsapp-consent-sql-lifecycle.test.cjs'
      - 'tests/whatsapp-atomic-consent-enrollment.test.cjs'
      - 'tests/whatsapp-atomic-consent-rls.test.cjs'
      - 'tests/whatsapp-signed-atomic-activation.test.cjs'
      - 'tests/whatsapp-signed-atomic-consent-client.test.js'
      - 'tests/whatsapp-pilot-atomic-consent.test.js'
      - 'tests/whatsapp-meta-phone-proof-issuer.test.js'
      - 'tests/whatsapp-pilot-web-consent.test.js'
      - 'tests/whatsapp-preview-build-boundary.test.js'
      - 'tests/whatsapp-pilot-preflight.test.js'
      - 'tests/whatsapp-isolated-neon-target-audit.test.js'
      - 'lib/whatsapp/pilot-preflight.js'
      - 'scripts/whatsapp-pilot-preflight.js'
      - 'scripts/build-static.js'
      - 'db/migrations/20261111_whatsapp_web_receipt_issuer_ci.sql'
      - 'db/migrations/20261111_whatsapp_verified_meta_proof_issuer_ci.sql'
      - 'db/migrations/20261111_whatsapp_signed_atomic_activation_ci.sql'
      - 'db/migrations/20261110_whatsapp_atomic_pairing_evidence_staged.sql'
      - '.github/workflows/whatsapp-consent-policy-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consent-policy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test consent and durable inbox policies
        run: node --test tests/whatsapp-consent-policy.test.js tests/whatsapp-tenant-revocation.test.js tests/whatsapp-durable-inbox.test.js tests/whatsapp-webhook.test.js tests/whatsapp-delivery-normalizer.test.js
      - name: Verify request-bound signed atomic client
        run: node --test tests/whatsapp-signed-atomic-consent-client.test.js tests/whatsapp-pilot-atomic-consent.test.js
      - name: Verify raw Meta-signature proof signer
        run: node --test tests/whatsapp-meta-phone-proof-issuer.test.js
      - name: Verify explicit versioned web consent issuer
        run: node --test tests/whatsapp-pilot-web-consent.test.js
      - name: Cross-check signed Meta pairing and canonical family identity regressions
        run: node --test tests/whatsapp-family-pairing.test.js tests/whatsapp-signed-family-pairing.test.js tests/whatsapp-canonical-verified-session.test.js tests/whatsapp-pilot-pairing-issuer.test.js tests/whatsapp-signed-consent-revoker.test.js tests/whatsapp-pilot-auth-bff.test.js tests/whatsapp-request-identity-binding.test.js
      - name: Verify isolated Neon metadata audit blocks cloned branches and does not authorize SQL
        run: node --test tests/whatsapp-isolated-neon-target-audit.test.js
      - name: Verify preflight always denies unapproved real traffic and redacts secrets
        run: node --test tests/whatsapp-pilot-preflight.test.js
      - name: Verify Vercel preview static build does not expose private code
        run: node --test tests/whatsapp-preview-build-boundary.test.js
      - name: PostgreSQL two-connection concurrency regression
        env:
          WHATSAPP_TEST_DATABASE_URL: postgresql://postgres:synthetic-test-only@127.0.0.1:5432/postgres
        run: |
          npm install --no-save --no-package-lock --ignore-scripts pg@8
          node --test tests/whatsapp-postgres-concurrency.test.cjs
          node --test tests/whatsapp-consent-sql-lifecycle.test.cjs
          node --test tests/whatsapp-atomic-consent-enrollment.test.cjs
          node --test tests/whatsapp-atomic-consent-rls.test.cjs
          node --test tests/whatsapp-signed-atomic-activation.test.cjs
