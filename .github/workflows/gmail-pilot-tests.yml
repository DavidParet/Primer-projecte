name: Gmail pilot — isolated tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'api/gmail/**'
      - 'lib/gmail/**'
      - 'tests/gmail-*.test.cjs'
      - 'scripts/probe-gmail-preview.cjs'
      - 'package.json'
      - '.github/workflows/gmail-pilot-tests.yml'
  push:
    branches:
      - 'feature/gmail-readonly-pilot-*'
    paths:
      - 'api/gmail/**'
      - 'lib/gmail/**'
      - 'tests/gmail-*.test.cjs'
      - 'scripts/probe-gmail-preview.cjs'
      - 'package.json'
      - '.github/workflows/gmail-pilot-tests.yml'

permissions:
  contents: read

jobs:
  gmail-pilot:
    name: Gmail — offline safety suite
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_ENV: production
      GMAIL_PILOT_ENABLED: 'false'
      GOOGLE_CLIENT_ID: ''
      GOOGLE_CLIENT_SECRET: ''
      GMAIL_PILOT_DATABASE_URL: ''
    steps:
      - name: Checkout (no credentials retained)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check Gmail source syntax
        run: |
          for f in lib/gmail/*.cjs api/gmail/*.js api/gmail/pilot/*.js tests/gmail-*.test.cjs scripts/probe-gmail-preview.cjs; do
            node --check "$f"
          done
      - name: Run Gmail safety and authentication tests (no external accounts)
        run: node --test tests/gmail-*.test.cjs

      - name: Probe isolated Vercel preview HTTP (GET only; diagnostic)
        # No cookies, OAuth tokens, credentials or email. This external check is
        # advisory; only the offline safety suite gates this branch.
        env:
          GMAIL_PREVIEW_URL: https://primer-projecte-git-feature-gmail-r-42096a-davidparets-projects.vercel.app
        run: |
          set +e
          node scripts/probe-gmail-preview.cjs "$GMAIL_PREVIEW_URL"
          probe_exit=$?
          set -e
          case "$probe_exit" in
            0) echo "::notice::Preview HTTP contract reachable; this is NOT proof of real Gmail access." ;;
            3) echo "::notice::Vercel SSO prevents unauthenticated GET as expected; authenticated verification is documented separately." ;;
            4) echo "::notice::Preview routes are reachable and Gmail pilot remains guarded/not ready." ;;
            *) echo "::warning::Preview HTTP unverified (exit $probe_exit); check access, deployment and response contract." ;;
          esac
