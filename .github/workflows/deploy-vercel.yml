# The Vercel Git integration already creates deployments.
# This workflow runs validation only; it NEVER deploys or touches production.
name: NexLupa - validacions sense desplegament

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexlupa-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Syntax and regression smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: |
          find . -path './node_modules' -prune -o -path './.git' -prune -o -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
      - name: Existing priorities regression test
        run: node tests/run-test.js
      - name: Verify Claude audit verdict parser (offline)
        run: node tests/audit-qa50-claude.js --self-test
