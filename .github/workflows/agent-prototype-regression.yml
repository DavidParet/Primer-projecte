name: NEXLUPA agent prototype — isolated regression

on:
  pull_request:
    paths:
      - 'lib/premium-*'
      - 'scripts/*premium*'
      - 'tests/run-premium-*'
      - 'tests/fixtures/premium-*'
      - '.github/workflows/agent-prototype-regression.yml'

permissions:
  contents: read

jobs:
  synthetic-agent-tests:
    name: Offline agent regression suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify internal prototypes without API secrets
        env:
          RUN_LIVE_AGENT_EVAL: 'NO'
        run: node scripts/run-premium-prototype-tests.js
